[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalvortex"
version = "0.1.0"
description = "Multi-source market analytics: equity options, crypto futures, and monetary aggregates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "VortexAnalytica"}
]
keywords = ["options", "crypto", "quantitative-finance", "market-analysis", "monetary-aggregates"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
signalvortex = "signalvortex.cli.run_full:main"
sv-options = "signalvortex.cli.run_options:main"
sv-crypto = "signalvortex.cli.run_crypto:main"
sv-macro = "signalvortex.cli.run_macro:main"

[tool.hatch.build.targets.wheel]
packages = ["signalvortex"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=signalvortex --cov-report=term-missing"
